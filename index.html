<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Player UI</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    font-family: Arial, sans-serif;
}


.player{
    width:350px;
    padding:25px;
    border-radius:25px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(15px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    text-align:center;
    color:white;
}


.album-img{
    width:220px;
    height:220px;
    border-radius:20px;
    object-fit:cover;
    box-shadow:0 8px 25px rgba(0,0,0,0.5);
    transition:0.4s;
}

.album-img:hover{
    transform:scale(1.05);
}


h2{
    margin:15px 0 5px;
    color:#00f5d4;
}

.artist{
    color:#ddd;
    margin-bottom:20px;
}


.line{
    width:220px;
    accent-color:#00f5d4;
}


.controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
}


.buttons {
    display: flex;
    gap: 20px;
}


.btn{
    width:55px;
    height:55px;
    border-radius:50%;
    background:rgba(255,255,255,0.15);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    background:#00f5d4;
    color:#0f2027;
    transform:scale(1.15);
}


.play{
    width:70px;
    height:70px;
    font-size:25px;
    background:#00f5d4;
    color:#0f2027;
}
</style>
</head>

<body>

<div class="player">

    
    <img src="https://github.com/krithikaaduraisamy-crypto/task-3/blob/main/image.png?raw=true" alt="Album Cover" class="album-img">

    <h2>Nee kavithaigala</h2>
    <p class="artist">V. Pradeep Kumar</p>

    <div class="controls">
        <input type="range" min="0" max="100" value="5" class="line">

        <div class="buttons">
            <div class="btn">&#x23EE;</div>  
            <div class="btn play">&#x25B6;</div>  
            <div class="btn">&#x23ED;</div> 
        </div>
    </div>

</div>

</body>
</html>
